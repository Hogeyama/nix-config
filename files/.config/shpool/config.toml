# https://github.com/shell-pool/shpool/blob/master/CONFIG.md
# herdrのprefix+fで開くscratch shellの置き場として使う。

# 再接続したときに、離れる前の画面を描き直す。
session_restore_mode = "screen"

# プロンプトの先頭にセッション名を足さない。
prompt_prefix = ""

motd = "never"

# attachしたシェルに既定で渡るのはTERM・DISPLAY・SSH_AUTH_SOCKだけで、
# WAYLAND_DISPLAYがないとNeovimなどがwl-copyを使えずclipboardに書けない。
# 既存のセッションには効かないので、作り直す必要がある。
forward_env = ["WAYLAND_DISPLAY", "XDG_SESSION_TYPE"]

# 既定のCtrl-Space Ctrl-qは、ctrl+qがherdrのprefixなのでshpoolまで届かない。
[[keybinding]]
binding = 'Ctrl-\'
action = "detach"
